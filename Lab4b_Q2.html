<body>
    <h2>Book Information</h2>
    <p id="bookTitle"></p>
    <p id="bookAuthor"></p>
    <p id="bookGenres"></p>
    <script>

        fetch("Lab4b_Q1.json")
            .then(response => response.json())
            .then(data => {
k
                let firstBookTitle = data.Books[0].title;
                console.log("First Book Title: " + firstBookTitle);

                document.getElementById("bookTitle").textContent =
                    "First Book Title: " + firstBookTitle;


                let secondBookAuthor = data.Books[1].author;
