<!DOCTYPE html>
<html>
<head>
    <title>Question 1 - JavaScript DOM</title>
</head>
<body>
    <div id="myElement">
        <p>Welcome to my website!</p>
    </div>

    <script>
        // Select the div element using its ID
        let element = document.getElementById("myElement");

        // Change the paragraph content
        element.innerHTML = "<p>Hello there!</p>";
    </script>
</body>
</html>
